<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventário | Crônicas da Filosofia</title>
<style>
:root{--ouro:#d8b96b;--ouro-claro:#f3dfaa;--fundo:#07101d;--painel:#101d2e;--texto:#f3ead4;--suave:#b9c2d0;--borda:#806b3d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1b2b42 0%,#080f1b 58%,#03070d 100%);color:var(--texto);font-family:Georgia,'Times New Roman',serif;padding:24px}
main{max-width:1000px;margin:0 auto}.topo{text-align:center;padding:20px 10px 26px;border-bottom:1px solid #806b3d66}.marca{color:var(--ouro);letter-spacing:3px;text-transform:uppercase;font-size:12px}.topo h1{font-size:clamp(30px,5vw,46px);color:var(--ouro-claro);margin:12px 0 8px;text-shadow:0 2px 15px #d8b96b30}.topo p{color:var(--suave);margin:0}.painel{background:linear-gradient(145deg,#142338f2,#0a1423f2);border:1px solid var(--borda);border-radius:14px;padding:22px;margin-top:22px;box-shadow:0 12px 35px #0005}.resumo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:#070f1c99;border:1px solid #806b3d77;border-radius:10px;padding:14px;text-align:center}.stat strong{display:block;color:var(--ouro-claro);font-size:25px;margin-bottom:5px}.stat span{font-size:13px;color:var(--suave)}.abas{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 16px}.aba,button{font:inherit;cursor:pointer}.aba{padding:10px 15px;border:1px solid #806b3d;border-radius:8px;background:#0a1422;color:var(--texto)}.aba.ativa{background:#5b4825;color:#fff1c8;border-color:var(--ouro)}.itens{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.item{border:1px solid #806b3d99;background:#091321;border-radius:12px;padding:17px;min-height:155px}.icone{font-size:30px;margin-bottom:10px}.item h3{margin:0 0 8px;color:var(--ouro-claro);font-size:18px}.item p{margin:0;color:var(--suave);font-size:14px;line-height:1.5}.estado{display:inline-block;margin-top:12px;padding:5px 8px;border-radius:20px;font-size:11px;border:1px solid #526174;color:#b7c0cd}.estado.ganho{color:#f3dfaa;border-color:#b99b53;background:#7a5b1c30}.vazio{color:var(--suave);padding:25px;text-align:center;border:1px dashed #806b3d;border-radius:10px;line-height:1.6}.rodape{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0}.botao{padding:12px 18px;border-radius:8px;border:1px solid var(--ouro);background:#18253a;color:var(--ouro-claro);text-decoration:none}.botao.principal{background:#735923;color:#fff2c7}.nota{font-size:12px;color:#98a6b8;text-align:center;margin:12px 0 25px}
@media(max-width:520px){body{padding:12px}.painel{padding:15px}.resumo{grid-template-columns:1fr}.stat{display:flex;align-items:center;justify-content:center;gap:10px}.stat strong{margin:0}.aba{flex:1}}
</style>
</head>
<body>
<main>
<header class="topo"><div class="marca">Crônicas da Filosofia</div><h1>🎒 Inventário</h1><p>Relíquias, conhecimentos e recompensas da sua jornada.</p></header>
<section class="painel">
 <div class="resumo">
  <div class="stat"><strong id="pontos">0</strong><span>Pontos de filosofia</span></div>
  <div class="stat"><strong id="regioes">0 / 4</strong><span>Regiões concluídas</span></div>
  <div class="stat"><strong id="quantidade">0</strong><span>Recompensas conquistadas</span></div>
 </div>
 <div class="abas" role="tablist" aria-label="Categorias do inventário">
  <button class="aba ativa" data-filtro="todos">Todos</button><button class="aba" data-filtro="livros">Livros</button><button class="aba" data-filtro="itens">Itens mágicos</button><button class="aba" data-filtro="documentos">Documentos</button>
 </div>
 <div id="lista" class="itens" aria-live="polite"></div>
</section>
<div class="rodape"><a class="botao principal" href="mapa.html">← Voltar ao mapa</a><a class="botao" href="diario.html">📖 Abrir diário</a></div>
<p class="nota">As recompensas são atualizadas automaticamente conforme o progresso salvo neste navegador.</p>
</main>
<script>
(function(){
 const ler=(chave,alternativa='')=>{try{return localStorage.getItem(chave)??alternativa}catch(e){return alternativa}};
 const concluida=chave=>['sim','true','1'].includes(String(ler(chave,'')).toLowerCase());
 const regioes=[
  {chave:'regiaoGreciaConcluida',nome:'Grécia Antiga',titulo:'Pergaminho dos Primeiros Filósofos',tipo:'livros',icone:'📜',desc:'Registra as primeiras perguntas sobre a natureza e o início do pensamento filosófico.'},
  {chave:'reinoConhecimentoConcluido',nome:'Reino do Conhecimento',titulo:'Lente da Razão',tipo:'itens',icone:'🔮',desc:'Um artefato simbólico para lembrar de examinar ideias, argumentos e opiniões.'},
  {chave:'cidadeIdeiasConcluida',nome:'Cidade das Ideias',titulo:'Códice das Ideias',tipo:'livros',icone:'📘',desc:'Um livro especial sobre conceitos, ideias e a busca por compreender o que é real.'},
  {chave:'terrasGrandesQuestoesConcluida',nome:'Terras das Grandes Questões',titulo:'Mapa das Grandes Questões',tipo:'documentos',icone:'🗺️',desc:'Um mapa simbólico para continuar investigando questões importantes da filosofia.'}
 ];
 const extras=[{titulo:'Caderno de Reflexões',tipo:'documentos',icone:'🖋️',desc:'Um espaço simbólico para registrar perguntas e descobertas da aventura.',sempre:true},{titulo:'Marca do Viajante',tipo:'itens',icone:'🧭',desc:'O símbolo de quem escolheu começar uma jornada em busca da sabedoria.',sempre:true}];
 const itens=[...extras,...regioes.map(r=>({...r,desc:r.desc+' Região: '+r.nome+'.',obtido:concluida(r.chave)}))];
 const regioesFeitas=regioes.filter(r=>concluida(r.chave)).length;
 document.getElementById('pontos').textContent=ler('pontosFilosofia','0');
 document.getElementById('regioes').textContent=regioesFeitas+' / 4';
 document.getElementById('quantidade').textContent=extras.length+regioesFeitas;
 let filtro='todos';
 function render(){const lista=document.getElementById('lista');lista.innerHTML='';const visiveis=itens.filter(i=>(filtro==='todos'||i.tipo===filtro)&&(i.sempre||i.obtido));if(!visiveis.length){lista.innerHTML='<div class="vazio">Ainda não há recompensas nesta categoria.<br>Continue explorando as regiões para encontrar novos itens!</div>';return;}visiveis.forEach(i=>{const card=document.createElement('article');card.className='item';const icone=document.createElement('div');icone.className='icone';icone.textContent=i.icone;const titulo=document.createElement('h3');titulo.textContent=i.titulo;const desc=document.createElement('p');desc.textContent=i.desc;const estado=document.createElement('span');estado.className='estado '+((i.sempre||i.obtido)?'ganho':'');estado.textContent=i.sempre?'Disponível':(i.obtido?'Conquistado':'Ainda não conquistado');card.append(icone,titulo,desc,estado);lista.appendChild(card);});}
 document.querySelectorAll('.aba').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.aba').forEach(b=>b.classList.remove('ativa'));btn.classList.add('ativa');filtro=btn.dataset.filtro;render();}));
 render();
})();
</script>
</body>
</html>
